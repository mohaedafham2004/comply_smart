<!DOCTYPE html>
<html lang="en" class="h-full light" x-data="themeManager()" :class="{ 'dark': theme === 'dark', 'light': theme === 'light' }">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account — ComplySmart</title>

    <script>
        (function() {
            var t = localStorage.getItem('cs_theme') || 'light';
            if (t === 'dark') {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            } else {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script type="module" src="/src/js/api.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        html.dark, html.dark body { background-color: #000000 !important; color: #f4f4f5 !important; }
        html.light, html.light body { background-color: #f8fafc !important; }
        body { font-family: 'Inter', sans-serif; }
        .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.9); box-shadow: 0 4px 20px -2px rgba(148, 163, 184, 0.08); }
        .dark .glass-card { background: #09090b; border: 1px solid #27272a; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-black flex items-center justify-center p-6" x-data="registerForm()">

    <main class="w-full max-w-[460px]">
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-14 h-14 bg-indigo-600/10 text-indigo-600 dark:bg-zinc-800 dark:text-zinc-200 rounded-2xl flex items-center justify-center mb-3 border border-indigo-500/20">
                <span class="material-symbols-outlined text-[32px]">verified_user</span>
            </div>
            <h1 class="font-hanken text-2xl font-extrabold text-slate-900 dark:text-white">Create Account</h1>
            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1">Start managing Sri Lankan business compliance</p>
        </div>

        <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-5">
            <template x-if="errorMessage">
                <div class="bg-rose-500/10 text-rose-600 dark:text-rose-400 p-3.5 rounded-xl flex items-center gap-2 border border-rose-500/20 text-xs font-semibold">
                    <span class="material-symbols-outlined text-base shrink-0">error</span>
                    <span x-text="errorMessage"></span>
                </div>
            </template>

            <form @submit.prevent="submitRegister()" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 dark:text-zinc-300 block">Full Name *</label>
                    <input x-model="form.name" type="text" required placeholder="Alex Perera" 
                        class="w-full h-11 px-4 text-xs bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 dark:text-zinc-300 block">Work Email *</label>
                    <input x-model="form.email" type="email" required placeholder="alex@company.lk" 
                        class="w-full h-11 px-4 text-xs bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 dark:text-zinc-300 block">Business Name *</label>
                    <input x-model="form.business_name" type="text" required placeholder="Lanka Tech Solutions (Pvt) Ltd" 
                        class="w-full h-11 px-4 text-xs bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 dark:text-zinc-300 block">Password *</label>
                    <input x-model="form.password" type="password" required placeholder="Min 8 characters" 
                        class="w-full h-11 px-4 text-xs bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-700 dark:text-zinc-300 block">Confirm Password *</label>
                    <input x-model="form.password_confirmation" type="password" required placeholder="Confirm password" 
                        class="w-full h-11 px-4 text-xs bg-slate-100 dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <button type="submit" :disabled="loading" 
                    class="w-full h-11 bg-indigo-600 hover:bg-indigo-500 dark:bg-zinc-100 dark:hover:bg-white dark:text-black font-bold text-xs text-white rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    <span x-show="!loading">Register Business Account</span>
                    <span x-show="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Creating Account...</span>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-200 dark:border-zinc-800 text-center text-xs text-slate-500 dark:text-zinc-400">
                Already registered? <a href="/login.html" class="font-bold text-indigo-600 dark:text-indigo-400 underline">Sign In</a>
            </div>
        </div>
    </main>

    <script>
        function themeManager() {
            return { theme: localStorage.getItem('cs_theme') || 'light' };
        }
        function registerForm() {
            return {
                form: { name: '', email: '', business_name: '', password: '', password_confirmation: '' },
                loading: false,
                errorMessage: '',
                async submitRegister() {
                    this.loading = true;
                    this.errorMessage = '';
                    const res = await window.api('POST', '/auth/register', this.form);
                    this.loading = false;
                    const d = res.data?.data || res.data;
                    if (res.ok && d && d.token) {
                        localStorage.setItem('cs_token', d.token);
                        localStorage.setItem('cs_user', JSON.stringify(d.user));
                        if (d.business) localStorage.setItem('cs_business', JSON.stringify(d.business));
                        window.location.href = '/dashboard.html';
                    } else {
                        this.errorMessage = res.data?.message || 'Registration failed.';
                    }
                }
            };
        }
    </script>
</body>
</html>
