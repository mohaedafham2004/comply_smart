services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: complysmart_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
      - .env.docker
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - complysmart_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000/api/v1"
    container_name: complysmart_frontend
    ports:
      - "5174:5174"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - complysmart_net

  mongo:
    image: mongo:7.0
    container_name: complysmart_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - complysmart_net

networks:
  complysmart_net:
    driver: bridge

volumes:
  mongo_data:
  backend_vendor:
