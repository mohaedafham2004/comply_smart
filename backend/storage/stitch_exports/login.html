<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ComplySmart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#1b1b1d",
                        "surface-tint": "#565e74",
                        "surface-variant": "#e4e2e4",
                        "surface-container-highest": "#e4e2e4",
                        "surface-bright": "#fcf8fa",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container": "#f0edef",
                        "on-background": "#1b1b1d",
                        "on-tertiary-fixed-variant": "#574425",
                        "inverse-primary": "#bec6e0",
                        "primary-container": "#131b2e",
                        "on-primary-container": "#7c839b",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "primary": "#000000",
                        "on-primary-fixed": "#131b2e",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-surface-variant": "#45464d",
                        "outline-variant": "#c6c6cd",
                        "secondary-container": "#316bf3",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#98805d",
                        "on-secondary-fixed": "#00174b",
                        "on-secondary-fixed-variant": "#003ea8",
                        "surface-dim": "#dcd9db",
                        "on-secondary-container": "#fefcff",
                        "on-tertiary-fixed": "#271901",
                        "inverse-surface": "#303032",
                        "secondary-fixed-dim": "#b4c5ff",
                        "background": "#fcf8fa",
                        "outline": "#76777d",
                        "surface": "#fcf8fa",
                        "tertiary-fixed": "#fcdeb5",
                        "tertiary": "#000000",
                        "surface-container-high": "#eae7e9",
                        "surface-container-low": "#f6f3f5",
                        "secondary": "#0051d5",
                        "secondary-fixed": "#dbe1ff",
                        "inverse-on-surface": "#f3f0f2",
                        "primary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#271901",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "xl": "64px",
                        "md": "24px",
                        "base": "4px",
                        "container-max": "1440px",
                        "lg": "40px",
                        "sidebar-width": "260px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "display": ["Hanken Grotesk"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "metadata": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "metadata": ["11px", {"lineHeight": "14px", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F8FAFC; /* Specified neutral light gray fallback */
        }
        .focused-input:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .login-card {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="font-body-md text-on-surface min-h-screen flex items-center justify-center p-sm">
<!-- Login Container -->
<main class="w-full max-w-[420px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-[40px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">
                    verified_user
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">ComplySmart</h1>
<p class="font-body-md text-on-surface-variant mt-xs">Secure Enterprise Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest login-card rounded-xl p-md md:p-lg border border-outline-variant">
<form action="#" class="space-y-md" method="POST">
<!-- Validation Error State (Requested) -->
<div class="bg-error-container text-on-error-container p-sm rounded-lg flex items-start gap-sm border border-error/20 animate-pulse">
<span class="material-symbols-outlined text-[20px] shrink-0">error</span>
<p class="font-label-sm text-label-sm">Email already registered. Please sign in or use a different email.</p>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface block" for="email">Work Email</label>
<div class="relative">
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-lg bg-surface focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-lg bg-surface focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Stay Logged In -->
<div class="flex items-center gap-xs">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="remember">Keep me logged in</label>
</div>
<!-- Primary Login Button -->
<button class="w-full h-12 bg-primary-container text-on-primary-fixed-variant font-headline-md text-headline-md rounded-lg hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs shadow-sm" style="color: #ffffff; background-color: #131b2e;" type="submit">
                    Log in
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- SSO / Social Partition -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center text-metadata uppercase">
<span class="bg-surface-container-lowest px-sm text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs h-11 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-[18px] text-secondary">security</span>
<span class="font-label-sm text-label-sm">SSO</span>
</button>
<button class="flex items-center justify-center gap-xs h-11 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-[18px]">work</span>
<span class="font-label-sm text-label-sm">Google</span>
</button>
</div>
</div>
<!-- Registration Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-secondary font-semibold hover:underline" href="#">Register</a>
</p>
</div>
<!-- Footer Footer -->
<footer class="mt-xl pt-md border-t border-outline-variant/30 text-center">
<nav class="flex justify-center gap-md mb-xs">
<a class="font-metadata text-metadata text-on-surface-variant hover:text-secondary" href="#">Privacy Policy</a>
<a class="font-metadata text-metadata text-on-surface-variant hover:text-secondary" href="#">Terms of Service</a>
<a class="font-metadata text-metadata text-on-surface-variant hover:text-secondary" href="#">Trust Center</a>
</nav>
<p class="font-metadata text-metadata text-outline">© 2024 ComplySmart. All rights reserved.</p>
</footer>
</main>
<script>
        // Simple micro-interaction for password visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });

        // Form submission animation mock
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Validating...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
