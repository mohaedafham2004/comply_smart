<!DOCTYPE html>

                    "error": "#ba1a1a",
                    "primary": "#000000",
                    "on-primary-fixed": "#131b2e",
                    "tertiary-fixed-dim": "#dec29a",
                    "on-primary-fixed-variant": "#3f465c",

                    "outline-variant": "#c6c6cd",
                    "secondary-container": "#316bf3",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #F8FAFC;
        }
        .auth-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #E2E8F0;
        }
        input:focus {
            outline: none;
            border-color: #0051d5;
            box-shadow: 0 0 0 3px rgba(0, 81, 213, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Content Area: Centered Auth Card -->
<main class="flex-grow flex items-center justify-center px-sm py-xl">
<div class="w-full max-w-[440px]">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-md">
<div class="text-primary font-headline-lg text-headline-lg font-extrabold flex items-center gap-2 mb-xs">
<span class="material-symbols-outlined text-secondary" style="font-size: 32px;">verified_user</span>
                    ComplySmart
                </div>
<p class="text-on-surface-variant font-body-md text-body-md">Enterprise Compliance Management</p>
</div>
<!-- Registration Card -->
<div class="auth-card bg-surface-container-lowest p-md md:p-lg rounded-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Create your account</h1>
<p class="text-on-surface-variant font-body-md text-body-md mb-md">Start your 14-day free trial today.</p>
<form class="space-y-sm" id="registrationForm">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Full name</label>
<input class="w-full h-10 px-sm rounded bg-surface-container-low border border-outline-variant text-body-md focus:border-secondary transition-all" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<input class="w-full h-10 px-sm rounded bg-surface-container-low border border-outline-variant text-body-md focus:border-secondary transition-all" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<input class="w-full h-10 px-sm rounded bg-surface-container-low border border-outline-variant text-body-md focus:border-secondary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="confirmPassword">Confirm password</label>
<input class="w-full h-10 px-sm rounded bg-surface-container-low border border-error text-body-md focus:border-error transition-all" id="confirmPassword" name="confirmPassword" required="" type="password" value="password123"/>
<!-- Inline Validation Error -->
<div class="flex items-center gap-1 text-error" id="passwordError">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-metadata text-metadata">Passwords do not match</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-md bg-primary-container text-on-primary font-headline-md text-headline-md h-12 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Create account
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Helper Text -->
<div class="mt-md text-center">
<p class="text-on-surface-variant font-metadata text-metadata italic">
                        You'll set up your business details next
                    </p>
</div>
<!-- Footer Links -->
<div class="mt-lg pt-md border-t border-outline-variant text-center">
<p class="text-on-surface-variant font-body-md text-body-md">
                        Already have an account? 
                        <a class="text-secondary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Global Footer Links -->
<div class="mt-md flex justify-center gap-md">
<a class="text-on-surface-variant font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="text-on-surface-variant font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<a class="text-on-surface-variant font-label-sm text-label-sm hover:text-on-surface transition-colors" href="#">Contact Support</a>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Success State Animation
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Creating...`;
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
                btn.className = "w-full mt-md bg-secondary text-on-primary font-headline-md text-headline-md h-12 rounded-lg flex items-center justify-center gap-2";
                
                setTimeout(() => {
                    alert('Registration submitted! (Mock interaction)');
                    btn.innerHTML = originalContent;
                    btn.className = "w-full mt-md bg-primary-container text-on-primary font-headline-md text-headline-md h-12 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2";
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });

        // Real-time matching logic (UI representation)
        const pass = document.getElementById('password');
        const conf = document.getElementById('confirmPassword');
        const err = document.getElementById('passwordError');

        conf.addEventListener('input', () => {
            if (conf.value === pass.value) {
                conf.classList.remove('border-error');
                conf.classList.add('border-outline-variant');
                err.classList.add('hidden');
            } else {
                conf.classList.add('border-error');
                conf.classList.remove('border-outline-variant');
                err.classList.remove('hidden');
            }
        });
    </script>
</body></html>
